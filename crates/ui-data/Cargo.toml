[package]
name = "rust-desktop-ui-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed bounded data sources and adapters for desktop forms"

[features]
default = []
sqlite = ["dep:rusqlite"]
file-adapters = ["dep:serde", "dep:serde_json"]

[dependencies]
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
zip.workspace = true
roxmltree.workspace = true

[[example]]
name = "file_roundtrip"
required-features = ["file-adapters"]
