[workspace]
resolver = "2"
members = [
    "crates/ui-core",
    "crates/ui-render-wgpu",
    "examples/gpu-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/S-typy/rust-ui-engine"

[profile.release]
lto = "thin"
codegen-units = 1
