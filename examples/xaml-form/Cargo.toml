[package]
name = "xaml-form"
default-run = "xaml-form"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
rust-desktop-ui-text = { version = "0.1.0", path = "../../crates/ui-text" }
rust-desktop-ui-images = { path = "../../crates/ui-images", version = "0.1.0" }
rust-desktop-ui-core = { path = "../../crates/ui-core", version = "0.1.0" }
rust-desktop-ui-controls = { path = "../../crates/ui-controls", version = "0.1.0" }
rust-desktop-ui-data = { path = "../../crates/ui-data", version = "0.1.0", features = ["sqlite"] }
rust-desktop-ui-treegrid = { path = "../../crates/ui-treegrid", version = "0.1.0" }
rust-desktop-ui-platform-winit = { path = "../../crates/ui-platform-winit", version = "0.1.0" }
rust-desktop-ui-xaml = { path = "../../crates/ui-xaml", version = "0.1.0" }

[build-dependencies]
rust-desktop-ui-xaml = { path = "../../crates/ui-xaml", version = "0.1.0" }
